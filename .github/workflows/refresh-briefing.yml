name: Morning Market Briefing

on:
  schedule:
    # Every day at 8:05 AM IST (02:35 UTC) so the page is ready by 8:30.
    - cron: '35 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing
        env:
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GAS_URL: ${{ secrets.GAS_URL }}
          GAS_TOKEN: ${{ secrets.GAS_TOKEN }}
          BRIEF_PASSPHRASE: ${{ secrets.BRIEF_PASSPHRASE }}
          BRIEF_LOCAL_AREA: ${{ vars.BRIEF_LOCAL_AREA }}
          BRIEF_MODEL: ${{ vars.BRIEF_MODEL }}
          BRIEF_SEARCH_MODEL: ${{ vars.BRIEF_SEARCH_MODEL }}
        run: python scripts/generate_briefing.py

      - name: Commit updated briefing.json
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@github.com"
          git add data/briefing.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update morning briefing $(date -u +%F)"
            git pull --rebase -X theirs
            git push
          fi
